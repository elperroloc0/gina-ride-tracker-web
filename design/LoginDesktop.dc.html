<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Archivo+Black&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1A18F0; text-decoration: none; }
    a:hover { color: #1210B8; }
    .gds-signin-btn { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .gds-signin-btn:hover { box-shadow: 0 4px 14px rgba(26,24,240,0.28); }
    .gds-signin-btn:hover .gds-van-icon { transform: translateX(5px); }
    .gds-signin-btn:active { transform: scale(0.97); }
    .gds-signin-btn:active .gds-van-icon { transform: translateX(9px); }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: #F5F5F2; color: #17171A; overflow: hidden;">

  

  <div style="flex: 0 0 640px; position: relative; z-index: 0; background: #1A18F0; color: #FFFFFF; overflow: hidden; display: flex; flex-direction: column; padding: 56px;">

    <img src="login-map.jpg" alt="" style="position: absolute; inset: -12px; z-index: -2; width: calc(100% + 24px); height: calc(100% + 24px); object-fit: cover; object-position: 78% 40%; display: block; filter: blur(3px); transform: scale(1.03);">
    <div style="position: absolute; inset: 0; z-index: -1; background: linear-gradient(165deg, rgba(8,7,110,0.86) 0%, rgba(26,24,240,0.7) 45%, rgba(8,7,110,0.88) 100%);"></div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="gina-mark-white.webp" alt="" style="width: 30px; height: 30px; display: block;">
      <span style="font-family: 'Archivo Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 0.07em; text-transform: uppercase;">Gina's Gymnastics</span>
    </div><div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; max-width: 460px; position: relative">
      <div style="font-family: 'Archivo Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 64px; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase; text-wrap: pretty; width: 641px; height: 133px">Know when<br>they're there</div>
    </div>
  </div><div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative">
    <div style="width: 400px; display: flex; flex-direction: column; gap: 24px;">

      <div>
        <div style="font-family: 'Archivo Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 28px; letter-spacing: -0.02em; text-transform: uppercase;">Sign in</div>
        
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px;">
        <label style="display: flex; flex-direction: column; gap: 7px;">
          
          <div style="height: 42px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 14px; box-shadow: 0 2px 8px rgba(23,23,26,0.06); padding: 0 13px; display: flex; align-items: center; font-size: 13px; color: #17171A;">c.alvarez@example.com</div>
        </label>

        <label style="display: flex; flex-direction: column; gap: 7px;">

          <div style="height: 42px; box-sizing: border-box; background: #F7F7FF; border: 1.5px solid #1A18F0; border-radius: 14px; box-shadow: 0 2px 8px rgba(23,23,26,0.06); padding: 0 13px; display: flex; align-items: center; gap: 9px;">
            <span style="flex-grow: 1; font-size: 15px; letter-spacing: 0.14em; color: #17171A;">•••••••••</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="#6E6E73" stroke-width="1.7" stroke-linejoin="round"></path><circle cx="12" cy="12" r="3" stroke="#6E6E73" stroke-width="1.7"></circle></svg>
          </div>
        </label>
      </div>

      <button class="gds-signin-btn" style="height: 48px; border-radius: 14px; background: #1A18F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; border: none; cursor: pointer; box-shadow: 0 2px 8px rgba(23,23,26,0.12); font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;">
        <span>Sign in</span>
        <svg class="gds-van-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); flex-shrink: 0;">
          <path d="M2 9.5A1.5 1.5 0 0 1 3.5 8h9A1.5 1.5 0 0 1 14 9.5V16H2V9.5Z" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M14 11h3.4l3.1 3.3V16h-6.5v-5Z" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"/>
          <circle cx="6" cy="16.5" r="2" fill="#1A18F0" stroke="#FFFFFF" stroke-width="1.7"/>
          <circle cx="17" cy="16.5" r="2" fill="#1A18F0" stroke="#FFFFFF" stroke-width="1.7"/>
        </svg>
      </button>

      <div style="text-align: center; font-size: 12px; font-weight: 600; color: #1A18F0;">Forgot your password?</div>

      <div style="background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 14px; font-weight: 700;">Accounts are set up by the gym</div>
        <div style="font-size: 13px; color: #6E6E73; line-height: 1.45;">When your child is enrolled for van rides, we text you an invite link to pick a password.</div>
      </div>

      <div style="text-align: center; font-size: 13px; color: #6E6E73; line-height: 1.5;">
        Questions? Call the front desk<br><span style="color: #17171A; font-weight: 600;">1 (305) 456-4150</span>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
